services:
  - type: web
    name: fa-agent
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fa-agent-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://fa-agent.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_REDIRECT_URI
        value: https://fa-agent.onrender.com/api/auth/hubspot/callback
    healthCheckPath: /

databases:
  - name: fa-agent-db
    plan: free
    databaseName: fa_agent
    user: fa_agent_user
